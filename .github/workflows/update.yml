name: 更新油价调价日历

on:
  schedule:
    # 每周一 01:00 UTC（北京时间 09:00）
    - cron: "0 1 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 运行测试
        run: npm test

      - name: 抓取公告并生成 ics
        run: node scripts/update.mjs

      - name: 提交变更
        run: |
          git add data/adjustments.json oil-pricing.ics
          if git diff --cached --quiet; then
            echo "日历没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 更新油价调价日历 $(date -u +%Y-%m-%d)"
          git push
